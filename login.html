<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>টিম মেম্বার লগইন | NBIT Agency</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background: #f4f7fe;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card h2 { color: #2b3674; margin-bottom: 1.5rem; }
        .input-group { margin-bottom: 1.2rem; text-align: left; }
        .input-group label { font-weight: 600; font-size: 0.9rem; color: #707eae; }
        .input-group input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #e0e5f2;
            border-radius: 8px;
            margin-top: 0.3rem;
            box-sizing: border-box;
        }
        .btn-login {
            width: 100%;
            background: #0066ff;
            color: white;
            border: none;
            padding: 0.8rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-login:hover { background: #0052cc; }
        #error-msg { color: red; margin-top: 1rem; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>NBIT টিম মেম্বার লগইন</h2>
    <div class="input-group">
        <label>ইমেইল (Email)</label>
        <input type="email" id="email" placeholder="member@nbit.com">
    </div>
    <div class="input-group">
        <label>পাসওয়ার্ড (Password)</label>
        <input type="password" id="password" placeholder="******">
    </div>
    <button class="btn-login" onclick="loginUser()">লগইন করুন</button>
    <div id="error-msg"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDW_LjAxDCr5YL5Algw5rlKX6CToxc6Kmw",
    authDomain: "nbit-agency.firebaseapp.com",
    projectId: "nbit-agency",
    storageBucket: "nbit-agency.firebasestorage.app",
    messagingSenderId: "306435778496",
    appId: "1:306435778496:web:807a5c2ca0781170340a25"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  window.loginUser = function() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const errorMsg = document.getElementById("error-msg");

      signInWithEmailAndPassword(auth, email, password)
      .then((userCredential) => {
          window.location.href = "dashboard.html";
      })
      .catch((error) => {
          errorMsg.innerText = "ভুল ইমেইল বা পাসওয়ার্ড দেওয়া হয়েছে!";
      });
  }
</script>

</body>
</html>
