<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>টিম মেম্বার ড্যাশবোর্ড | NBIT Agency</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background: #f4f7fe; padding: 2rem; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f4f7fe; padding-bottom: 1rem; margin-bottom: 2rem; }
        .btn-logout { background: #ff4d4d; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .post-form label { font-weight: 600; color: #2b3674; margin-bottom: 0.3rem; display: block; }
        .post-form textarea, .post-form input { width: 100%; padding: 0.8rem; margin-bottom: 1.2rem; border: 1px solid #e0e5f2; border-radius: 8px; box-sizing: border-box; font-family: inherit; }
        .btn-submit { background: #0066ff; color: white; border: none; padding: 0.8rem 1.5rem; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; font-size: 1rem; }
        .btn-submit:hover { background: #0052cc; }
        #status-msg { margin-top: 1rem; font-weight: 600; text-align: center; word-break: break-all; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>টিম মেম্বার ড্যাশবোর্ড</h2>
        <button class="btn-logout" onclick="logout()">লগআউট</button>
    </div>

    <div class="post-form">
        <h3 style="margin-bottom: 1.5rem; color: #2b3674;">ক্লায়েন্টদের জন্য নতুন আপডেট / প্রজেক্ট পোস্ট করুন</h3>
        
        <label>প্রজেক্টের শিরোনাম</label>
        <input type="text" id="postTitle" placeholder="যেমন: ই-কমার্স ওয়েবসাইট ডেভেলপমেন্ট">

        <label>ডিভাইস থেকে ছবি নির্বাচন করুন</label>
        <input type="file" id="postImageFile" accept="image/*">

        <label>প্রজেক্টের বিবরণ</label>
        <textarea id="postDesc" rows="4" placeholder="প্রজেক্টের বিস্তারিত তথ্য ও কাজের বিবরণ লিখুন..."></textarea>
        
        <button class="btn-submit" onclick="submitPost()">ওয়েবসাইটে পোস্ট করুন</button>
        <div id="status-msg"></div>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDW_LjAxDCr5YL5Algw5rlKX6CToxc6Kmw",
    authDomain: "nbit-agency.firebaseapp.com",
    projectId: "nbit-agency",
    storageBucket: "nbit-agency.firebasestorage.app",
    messagingSenderId: "306435778496",
    appId: "1:306435778496:web:807a5c2ca0781170340a25"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.href = "login.html";
    }
  });

  window.logout = function() {
      signOut(auth).then(() => {
          window.location.href = "login.html";
      });
  }

  // ছবির সাইজ সংকুচিত (Compress) করার ফাংশন
  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          const canvas = document.createElement("canvas");
          const maxWidth = 600; // সাইজ কমিয়ে ৬০০ পিক্সেল করা হয়েছে
          const scaleSize = maxWidth / img.width;
          
          if (img.width > maxWidth) {
              canvas.width = maxWidth;
              canvas.height = img.height * scaleSize;
          } else {
              canvas.width = img.width;
              canvas.height = img.height;
          }

          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          
          // মাত্র ৫০% কোয়ালিটিতে কনভার্ট (অত্যন্ত হালকা সাইজ)
          resolve(canvas.toDataURL("image/jpeg", 0.5)); 
        };
        img.onerror = (err) => reject(err);
      };
      reader.onerror = (err) => reject(err);
    });
  }

  window.submitPost = async function() {
      const title = document.getElementById("postTitle").value;
      const fileInput = document.getElementById("postImageFile");
      const desc = document.getElementById("postDesc").value;
      const statusMsg = document.getElementById("status-msg");

      if(!title || fileInput.files.length === 0) {
          alert("দয়া করে শিরোনাম এবং একটি ছবি নির্বাচন করুন!");
          return;
      }

      const file = fileInput.files[0];
      statusMsg.style.color = "#0066ff";
      statusMsg.innerText = "ছবি প্রসেস করা হচ্ছে, অপেক্ষা করুন...";

      try {
          // ১. ছবি কম্প্রেস করা
          const imageUrl = await compressImage(file);
          statusMsg.innerText = "ডাটাবেসে সেভ হচ্ছে...";

          // ২. ডাটাবেসে তথ্য সেভ করা
          await addDoc(collection(db, "posts"), {
              title: title,
              image: imageUrl,
              description: desc,
              createdAt: serverTimestamp()
          });

          statusMsg.style.color = "green";
          statusMsg.innerText = "পোস্ট সফলভাবে ওয়েবসাইটে যুক্ত হয়েছে!";

          document.getElementById("postTitle").value = "";
          fileInput.value = "";
          document.getElementById("postDesc").value = "";

      } catch (error) {
          console.error(error);
          statusMsg.style.color = "red";
          // প্রকৃত এরর মেসেজ স্ক্রিনে দেখাবে
          statusMsg.innerText = "এরর: " + (error.message || "পোস্ট সেভ হয়নি!");
      }
  }
</script>

</body>
</html>
